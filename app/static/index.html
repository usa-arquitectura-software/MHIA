<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login y Registro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
            width: 300px;
            text-align: center;
        }
        h2 {
            margin-bottom: 10px;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .toggle-btn {
            background: none;
            color: #007bff;
            text-decoration: underline;
            cursor: pointer;
            border: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 id="form-title">Login</h2>
        <form id="auth-form">
            <input type="email" id="email" placeholder="Correo electrónico" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <input type="text" id="name" placeholder="Nombre" style="display: none;">
            <input type="number" id="age" placeholder="Edad" style="display: none;">
            <button type="submit">Iniciar sesión</button>
        </form>
        <button class="toggle-btn" onclick="toggleForm()">¿No tienes cuenta? Regístrate</button>
    </div>

    <script>
        let isLogin = true; // Estado actual (Login o Registro)

        function toggleForm() {
            isLogin = !isLogin;
            document.getElementById("form-title").innerText = isLogin ? "Login" : "Registro";
            document.querySelector("button[type='submit']").innerText = isLogin ? "Iniciar sesión" : "Registrarse";
            document.getElementById("name").style.display = isLogin ? "none" : "block";
            document.getElementById("age").style.display = isLogin ? "none" : "block";
            document.querySelector(".toggle-btn").innerText = isLogin ? "¿No tienes cuenta? Regístrate" : "¿Ya tienes cuenta? Inicia sesión";
        }

        document.getElementById("auth-form").addEventListener("submit", async function(event) {
            event.preventDefault();
            
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const name = document.getElementById("name").value;
            const age = document.getElementById("age").value;

            const url = isLogin ? "/login" : "/register";
            const bodyData = isLogin ? { email, password } : { email, password, name, age };

            try {
                const response = await fetch(`http://127.0.0.1:8000${url}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(bodyData),
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || "Algo salió mal");

                alert(data.message);
            } catch (error) {
                alert(error.message);
            }
        });
    </script>

</body>
</html>
